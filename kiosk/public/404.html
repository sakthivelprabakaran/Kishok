<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — 404 | YoursGifts</title>
    <meta name="description" content="Page not found. Return to YoursGifts 3D Customizer shop.">
    <meta name="robots" content="noindex, follow">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#FF4D2E">

    <link rel="stylesheet" href="css/kiosk.css?v=desk3">
    <link rel="stylesheet" href="css/legal.css?v=wa1">
    <style>
      .error-card {
        text-align: center;
        padding: 48px 24px;
        margin: 40px auto;
        max-width: 540px;
        background: var(--bg-card, #ffffff);
        border: 2px solid var(--border, #1a1714);
        border-radius: 12px;
        box-shadow: 4px 4px 0px var(--shadow, #1a1714);
      }
      .error-code {
        font-family: 'Bricolage Grotesque', sans-serif;
        font-size: 72px;
        font-weight: 800;
        color: var(--primary, #FF4D2E);
        line-height: 1;
        margin-bottom: 12px;
      }
      .error-msg {
        font-size: 18px;
        color: var(--text-muted, #555);
        margin-bottom: 24px;
      }
      .home-btn {
        display: inline-block;
        background: var(--primary, #FF4D2E);
        color: #fff;
        font-weight: 700;
        text-decoration: none;
        padding: 12px 24px;
        border: 2px solid #1a1714;
        border-radius: 8px;
        box-shadow: 3px 3px 0px #1a1714;
        transition: transform 0.1s;
      }
      .home-btn:hover {
        transform: translate(-1px, -1px);
        box-shadow: 4px 4px 0px #1a1714;
      }
    </style>
</head>
<body>
  <main class="legal-page">
    <div class="legal-topbar">
