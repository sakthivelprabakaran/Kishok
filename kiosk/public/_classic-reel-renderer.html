<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Classic Keychain Render Reel Generator</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, sans-serif;
            color: #172b35;
            background: #eef9fb;
        }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 24px; }
        .render-shell {
            width: min(960px, 100%);
            margin: 0 auto;
        }
        .render-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }
        .render-panel {
            min-width: 0;
            padding: 16px;
            background: #fff;
            border: 1.5px solid #172b35;
            border-radius: 18px;
            box-shadow: 4px 4px 0 #172b35;
        }
        h1 { margin: 0 0 8px; font-size: 1.45rem; }
        h2 { margin: 0 0 12px; font-size: 1rem; }
        p { margin: 0 0 18px; color: #52656d; }
        #classicReelViewer,
        .captured-stage {
            position: relative;
            width: 100%;
            aspect-ratio: 7 / 5;
            overflow: hidden;
            border-radius: 14px;
            background:
                radial-gradient(circle at 52% 38%, rgba(255,255,255,.98) 0 18%, rgba(222,248,250,.82) 52%, rgba(195,236,241,.92) 100%),
                linear-gradient(145deg, #f8feff, #dff7fa);
        }
        #classicReelViewer canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }
        #classicReelComparison {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        #renderStatus {
            margin: 18px 0 0;
            padding: 12px 14px;
            min-height: 44px;
            border-radius: 12px;
            background: #172b35;
            color: #fff;
            font: 700 .82rem/1.5 ui-monospace, SFMono-Regular, Consolas, monospace;
            white-space: pre-wrap;
        }
        #render-output { display: none; }
        @media (max-width: 720px) {
            body { padding: 14px; }
            .render-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <main class="render-shell">
        <h1>Classic Keychain exact-render pilot</h1>
        <p>The live viewer and captured middle frame below use the same payload.</p>
        <div class="render-grid">
            <section class="render-panel">
                <h2>Live KeychainViewer</h2>
                <div id="classicReelViewer" aria-label="Live Classic Keychain render"></div>
            </section>
            <section class="render-panel">
                <h2>Generated centre poster</h2>
                <div class="captured-stage">
                    <img id="classicReelComparison" alt="Generated Classic Keychain poster">
                </div>
            </section>
        </div>
        <div id="renderStatus">Preparing exact 3D render…</div>
        <pre id="render-output" aria-hidden="true"></pre>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/clipper-lib@6.4.2/clipper.min.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
            "three-mesh-bvh": "https://esm.sh/three-mesh-bvh@0.7.8?external=three",
            "three-bvh-csg": "https://esm.sh/three-bvh-csg@0.0.16?external=three,three-mesh-bvh"
        }
    }
    </script>
    <script type="module" src="js/classic-reel-renderer.js?v=pilot2"></script>
</body>
</html>
