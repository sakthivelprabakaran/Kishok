<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 132" role="img" aria-labelledby="title desc">
  <title id="title">Name Beads preview</title>
  <desc id="desc">Four blue name beads spelling EMMA on a connecting strip.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="2.5" dy="3" stdDeviation="0" flood-color="#1a1714" flood-opacity=".8"/>
    </filter>
    <linearGradient id="bead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#70a9ff"/>
      <stop offset="1" stop-color="#3a88fe"/>
    </linearGradient>
  </defs>
  <g filter="url(#shadow)">
    <rect x="10" y="58" width="180" height="16" rx="6" fill="#3a88fe" stroke="#172b35" stroke-width="2"/>
    <g fill="url(#bead)" stroke="#172b35" stroke-width="2.5">
      <rect x="22" y="29" width="34" height="74" rx="7"/>
      <rect x="63" y="29" width="34" height="74" rx="7"/>
      <rect x="104" y="29" width="34" height="74" rx="7"/>
      <rect x="145" y="29" width="34" height="74" rx="7"/>
    </g>
  </g>
  <g fill="#fff" stroke="#d9e8ff" stroke-width=".8" text-anchor="middle"
     font-family="Arial Black, Arial, sans-serif" font-size="30" font-weight="900">
    <text x="39" y="77">E</text>
    <text x="80" y="77">M</text>
    <text x="121" y="77">M</text>
    <text x="162" y="77">A</text>
  </g>
</svg>
